<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="backdropGlow" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#2A2A2A" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#0F0F0F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </radialGradient>

    <!-- Grunge Pattern -->
    <pattern id="grungeBG" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.04" />
      <circle cx="80" cy="50" r="1" fill="#FFFFFF" opacity="0.05" />
      <circle cx="120" cy="110" r="1.2" fill="#FFFFFF" opacity="0.03" />
      <circle cx="50" cy="130" r="1" fill="#FFFFFF" opacity="0.04" />
    </pattern>

    <!-- Star Path -->
    <path id="star" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#E0E0E0" />
    <path id="halfStar" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#E0E0E0" opacity="0.4" />
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#backdropGlow)" />
  <rect width="1600" height="900" fill="url(#grungeBG)" />

  <!-- Right Side Silhouette Watermark -->
  <g transform="translate(1250, 450) scale(3.5)" opacity="0.1">
    <path d="M -40,-40 C -20,-60 20,-60 40,-40 L 55,-20 L 70,40 L 65,180 L 30,180 L 20,80 L -20,80 L -30,180 L -65,180 L -70,40 L -55,-20 Z" fill="#FFFFFF" />
    <path d="M -25,-60 C -25,-85 25,-85 25,-60 L 25,-40 L -25,-40 Z" fill="#FFFFFF" />
    <path d="M -45,-75 L 45,-75 L 35,-85 L -35,-85 Z" fill="#FFFFFF" />
    <path d="M -70,20 L -140,-30 L -145,-22 L -75,30 Z" fill="#FFFFFF" />
  </g>

  <!-- Red Blood Splatter Accent -->
  <ellipse cx="1300" cy="700" rx="200" ry="20" fill="#8B0000" opacity="0.3" />

  <!-- Badge -->
  <rect x="120" y="250" width="220" height="40" rx="20" fill="#8B0000" />
  <text x="230" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" letter-spacing="1">DARK CINEMA</text>

  <!-- Stars Row -->
  <g transform="translate(230, 340)">
    <use href="#star" x="-120" y="0" />
    <use href="#star" x="-80" y="0" />
    <use href="#star" x="-40" y="0" />
    <use href="#star" x="0" y="0" />
    <use href="#star" x="40" y="0" />
    <use href="#star" x="80" y="0" />
    <use href="#star" x="120" y="0" />
    <use href="#star" x="160" y="0" />
    <use href="#star" x="200" y="0" />
    <use href="#star" x="240" y="0" />
    <use href="#halfStar" x="280" y="0" />
  </g>

  <!-- Names -->
  <text x="120" y="420" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#E0E0E0">Yash • Nayanthara • Kiara Advani • Huma Qureshi</text>

  <!-- Description -->
  <text x="120" y="470" font-family="Arial, sans-serif" font-size="18" fill="#AAAAAA">A dark, stylish and unconventional fairy tale where crime meets myth.</text>

  <!-- Director & Verdict -->
  <text x="120" y="530" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#B22222">⭐ 4.0 / 5.0 • ONE-TIME WATCH</text>

  <!-- Faded Right Stars -->
  <g transform="translate(1300, 350)" opacity="0.08">
    <use href="#star" x="0" y="0" transform="scale(3)" />
    <use href="#star" x="100" y="0" transform="scale(3)" />
    <use href="#star" x="200" y="0" transform="scale(3)" />
    <use href="#star" x="300" y="0" transform="scale(3)" />
  </g>
</svg>