<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3B0000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1" />
    </radialGradient>
    
    <!-- Web Pattern -->
    <pattern id="webPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0 50 Q 50 0 100 50 Q 50 100 0 50" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1" />
      <path d="M 50 0 Q 0 50 50 100 Q 100 50 50 0" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1" />
    </pattern>

    <!-- Star Path -->
    <path id="star" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#FFFFFF" />
    
    <!-- Spider Mask -->
    <g id="spiderMask">
      <!-- Head Shape -->
      <path d="M 0,-60 C 40,-60 60,-20 60,20 C 60,60 40,90 0,90 C -40,90 -60,60 -60,20 C -60,-20 -40,-60 0,-60 Z" fill="#1A1A1A" />
      <!-- Eyes -->
      <path d="M -35,-10 C -15,-25 -5,-10 -10,10 C -15,25 -35,20 -35,-10 Z" fill="#FFFFFF" />
      <path d="M 35,-10 C 15,-25 5,-10 10,10 C 15,25 35,20 35,-10 Z" fill="#FFFFFF" />
      <!-- Eye Outline -->
      <path d="M -35,-10 C -15,-25 -5,-10 -10,10 C -15,25 -35,20 -35,-10 Z" fill="none" stroke="#000000" stroke-width="2" />
      <path d="M 35,-10 C 15,-25 5,-10 10,10 C 15,25 35,20 35,-10 Z" fill="none" stroke="#000000" stroke-width="2" />
      <!-- Web lines on mask -->
      <path d="M 0,-60 L 0,90 M -60,20 L 60,20 M -40,-40 L 40,80 M 40,-40 L -40,80" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bgGlow)" />
  <rect width="800" height="1200" fill="url(#webPattern)" />

  <!-- Top Rating Badge -->
  <rect x="250" y="80" width="300" height="50" rx="25" fill="#E62429" opacity="0.9" />
  <text x="400" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF" letter-spacing="2">⭐ 4.9 / 5.0 RATING</text>

  <!-- Central Graphic -->
  <g transform="translate(400, 350)">
    <!-- Glowing Orbit Lines -->
    <ellipse cx="0" cy="0" rx="250" ry="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="250" ry="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="250" ry="100" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" transform="rotate(90)" />
    
    <!-- Glow behind mask -->
    <circle cx="0" cy="0" r="120" fill="#E62429" opacity="0.3" filter="blur(20px)" />
    
    <!-- Spider Mask -->
    <use href="#spiderMask" transform="scale(1.5)" />
    
    <!-- Web Shooter Line (Yellow) -->
    <path d="M 60,40 L 120,80" stroke="#F5A623" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Stars Row -->
  <g transform="translate(400, 650)">
    <use href="#star" x="-200" y="0" />
    <use href="#star" x="-150" y="0" />
    <use href="#star" x="-100" y="0" />
    <!-- Half Star / Different Shape -->
    <path d="M -50,-15 L -46,-4 L -35,-4 L -44,3 L -41,14 L -50,7 L -59,14 L -56,3 L -65,-4 L -54,-4 Z" fill="#FFFFFF" opacity="0.6" />
    <use href="#star" x="0" y="0" />
    <use href="#star" x="50" y="0" />
    <use href="#star" x="100" y="0" />
    <use href="#star" x="150" y="0" />
    <use href="#star" x="200" y="0" />
  </g>

  <!-- Title Text -->
  <text x="400" y="730" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#E62429" letter-spacing="4">A MARVEL STUDIOS FILM</text>

  <!-- Info Box -->
  <rect x="100" y="780" width="600" height="120" rx="15" fill="#111111" stroke="#333333" stroke-width="1" />
  
  <!-- Genre -->
  <text x="150" y="820" font-family="Arial, sans-serif" font-size="14" fill="#888888" letter-spacing="1">GENRE</text>
  <text x="150" y="850" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Action / Superhero</text>
  
  <!-- Starring -->
  <text x="400" y="820" font-family="Arial, sans-serif" font-size="14" fill="#888888" letter-spacing="1">STARRING</text>
  <text x="400" y="850" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Tom Holland</text>
  
  <!-- Verdict -->
  <text x="600" y="820" font-family="Arial, sans-serif" font-size="14" fill="#888888" letter-spacing="1">VERDICT</text>
  <text x="600" y="850" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#E62429">Masterpiece</text>

  <!-- Quote -->
  <text x="400" y="970" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#CCCCCC">"With great power comes great responsibility."</text>

  <!-- Bottom Badge -->
  <rect x="250" y="1030" width="300" height="50" rx="10" fill="#E62429" />
  <text x="400" y="1062" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF" letter-spacing="2">7 OSCAR WINNER</text>
</svg>