<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="backdropGlow" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#1B3A5C" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#0A1520" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050A10" stop-opacity="1" />
    </radialGradient>
    
    <!-- Wave Watermark -->
    <pattern id="waveWatermark" x="0" y="0" width="200" height="100" patternUnits="userSpaceOnUse">
      <path d="M 0 50 Q 50 20 100 50 T 200 50" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.06" />
    </pattern>

    <!-- Star -->
    <path id="star" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#FFFFFF" />
    <path id="halfStar" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#FFFFFF" opacity="0.6" />
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#backdropGlow)" />
  <rect width="1600" height="900" fill="url(#waveWatermark)" />

  <!-- Right Side Greek Helmet Watermark -->
  <g transform="translate(1200, 450) scale(3.5)" opacity="0.12">
    <path d="M 0,-70 C 45,-70 65,-30 65,15 L 65,45 L -65,45 L -65,15 C -65,-30 -45,-70 0,-70 Z" fill="#D4AF37" />
    <path d="M -25,15 L -25,60 C -25,75 -15,85 0,85 C 15,85 25,75 25,60 L 25,15 Z" fill="#000000" />
    <path d="M -5,-70 L -5,-95 L 5,-95 L 5,-70 Z" fill="#D4AF37" />
    <path d="M 0,-95 Q 15,-110 5,-130 Q -5,-110 0,-95" fill="#D4AF37" />
  </g>

  <!-- Badge -->
  <rect x="120" y="250" width="240" height="40" rx="20" fill="#D4AF37" />
  <text x="240" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#0A0A0A" letter-spacing="1">HOLLYWOOD MASTERPIECE</text>

  <!-- Stars Row -->
  <g transform="translate(230, 340)">
    <use href="#star" x="-120" y="0" />
    <use href="#star" x="-80" y="0" />
    <use href="#star" x="-40" y="0" />
    <use href="#star" x="0" y="0" />
    <use href="#star" x="40" y="0" />
    <use href="#star" x="80" y="0" />
    <use href="#star" x="120" y="0" />
    <use href="#star" x="160" y="0" />
    <use href="#star" x="200" y="0" />
    <use href="#star" x="240" y="0" />
    <use href="#halfStar" x="280" y="0" />
  </g>

  <!-- Names -->
  <text x="120" y="420" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#D4AF37">Christopher Nolan • Matt Damon • Tom Holland</text>

  <!-- Description -->
  <text x="120" y="470" font-family="Arial, sans-serif" font-size="18" fill="#B0BEC5">A sweeping, mythic cinematic voyage across gods, monsters, and the endless sea.</text>

  <!-- Rating -->
  <text x="120" y="530" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#F5A623">⭐ 5.0 / 5.0 • CRITICAL TRIUMPH</text>

  <!-- Faded Right Stars -->
  <g transform="translate(1300, 350)" opacity="0.08">
    <use href="#star" x="0" y="0" transform="scale(3)" />
    <use href="#star" x="100" y="0" transform="scale(3)" />
    <use href="#star" x="200" y="0" transform="scale(3)" />
    <use href="#star" x="300" y="0" transform="scale(3)" />
  </g>
</svg>