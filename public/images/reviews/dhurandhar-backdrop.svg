<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="backdropGlow" cx="80%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#B85C1E" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#3D3520" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#14110A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </radialGradient>

    <!-- Grunge Pattern -->
    <pattern id="grungeBG" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" opacity="0.04" />
      <circle cx="80" cy="50" r="1" fill="#FFFFFF" opacity="0.05" />
      <circle cx="120" cy="110" r="1.2" fill="#FFFFFF" opacity="0.03" />
      <circle cx="50" cy="130" r="1" fill="#FFFFFF" opacity="0.04" />
    </pattern>

    <!-- Star Path -->
    <path id="star" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#E8DCC0" />
    <path id="halfStar" d="M 0,-15 L 4,-4 L 15,-4 L 6,3 L 9,14 L 0,7 L -9,14 L -6,3 L -15,-4 L -4,-4 Z" fill="#E8DCC0" opacity="0.4" />
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#backdropGlow)" />
  <rect width="1600" height="900" fill="url(#grungeBG)" />

  <!-- Right Side Crosshair Watermark -->
  <g transform="translate(1250, 450)" opacity="0.12">
    <circle cx="0" cy="0" r="300" fill="none" stroke="#B85C1E" stroke-width="2" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#B85C1E" stroke-width="2" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#B85C1E" stroke-width="2" />
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#B85C1E" stroke-width="2" />
    <line x1="0" y1="-350" x2="0" y2="350" stroke="#B85C1E" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#B85C1E" />
  </g>

  <!-- Orange Accent Bar -->
  <rect x="120" y="230" width="220" height="40" rx="20" fill="#B85C1E" />
  <text x="230" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" letter-spacing="1">ESPIONAGE THRILLER</text>

  <!-- Stars Row -->
  <g transform="translate(230, 340)">
    <use href="#star" x="-120" y="0" />
    <use href="#star" x="-80" y="0" />
    <use href="#star" x="-40" y="0" />
    <use href="#star" x="0" y="0" />
    <use href="#star" x="40" y="0" />
    <use href="#star" x="80" y="0" />
    <use href="#star" x="120" y="0" />
    <use href="#star" x="160" y="0" />
    <use href="#star" x="200" y="0" />
    <use href="#star" x="240" y="0" />
    <use href="#halfStar" x="280" y="0" />
  </g>

  <!-- Cast Names -->
  <text x="120" y="420" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#E8DCC0">Ranveer Singh • Akshaye Khanna • Sanjay Dutt • R. Madhavan</text>

  <!-- Description -->
  <text x="120" y="470" font-family="Arial, sans-serif" font-size="18" fill="#B0A890">A gritty, high-stakes espionage drama built on secrets, sacrifice, and loyalty.</text>

  <!-- Rating & Verdict -->
  <text x="120" y="530" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FF6B1A">⭐ 4.0 / 5.0 • BLOCKBUSTER</text>

  <!-- Faded Right Stars -->
  <g transform="translate(1300, 700)" opacity="0.08">
    <use href="#star" x="0" y="0" transform="scale(3)" />
    <use href="#star" x="100" y="0" transform="scale(3)" />
    <use href="#star" x="200" y="0" transform="scale(3)" />
    <use href="#star" x="300" y="0" transform="scale(3)" />
  </g>
</svg>