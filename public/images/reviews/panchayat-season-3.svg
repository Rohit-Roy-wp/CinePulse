<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="panch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c0e" />
      <stop offset="40%" stop-color="#0d3b1f" />
      <stop offset="80%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#020d06" />
    </linearGradient>
    <radialGradient id="rural-sun" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#4ade80" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#16a34a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#panch-bg)" />
  <circle cx="400" cy="340" r="320" fill="url(#rural-sun)" />

  <!-- Iconic Phulera Overhead Water Tank Silhouette -->
  <g transform="translate(320, 260)">
    <!-- Tank Body -->
    <rect x="20" y="20" width="120" height="80" rx="12" fill="#14532d" stroke="#86efac" stroke-width="3" />
    <text x="80" y="68" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#bbf7d0" text-anchor="middle">PHULERA</text>
    <!-- Legs -->
    <line x1="30" y1="100" x2="10" y2="200" stroke="#86efac" stroke-width="4" />
    <line x1="130" y1="100" x2="150" y2="200" stroke="#86efac" stroke-width="4" />
    <line x1="80" y1="100" x2="80" y2="200" stroke="#86efac" stroke-width="3" />
    <line x1="20" y1="150" x2="140" y2="150" stroke="#86efac" stroke-width="2" />
  </g>

  <!-- Rating Badge -->
  <g transform="translate(300, 80)">
    <rect width="200" height="42" rx="21" fill="#052e16" stroke="#4ade80" stroke-width="1.5" />
    <text x="100" y="27" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#86efac" text-anchor="middle">★ 4.4 / 5.0 RATING</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="660" font-family="'Impact', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">PANCHAYAT</text>
  <text x="400" y="710" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#4ade80" letter-spacing="4" text-anchor="middle">SEASON 3</text>
  <text x="400" y="745" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1" letter-spacing="2" text-anchor="middle">A TVF ORIGINAL • DIRECTED BY DEEPAK KUMAR MISHRA</text>

  <!-- Metadata Cards -->
  <g transform="translate(100, 800)">
    <rect width="600" height="90" rx="16" fill="#000000" fill-opacity="0.65" stroke="#4ade80" stroke-opacity="0.3" />
    <text x="50" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">GENRE</text>
    <text x="50" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Comedy / Drama</text>
    
    <text x="240" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">PLATFORM</text>
    <text x="240" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Prime Video</text>

    <text x="430" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">VERDICT</text>
    <text x="430" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f59e0b">Must Watch</text>
  </g>

  <!-- Tagline -->
  <text x="400" y="960" font-family="system-ui, sans-serif" font-size="20" font-style="italic" fill="#bbf7d0" text-anchor="middle">"Dekh Raha Hai Binod? Chunav Aa Gaya Hai Phulera Mein!"</text>

  <g transform="translate(250, 1040)">
    <rect width="300" height="45" rx="8" fill="#16a34a" />
    <text x="150" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3" text-anchor="middle">TOP TRENDING OTT</text>
  </g>
</svg>
