<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App Icon Background -->
  <rect x="45" y="45" width="422" height="422" rx="100" ry="100" fill="url(#bgGradient)" />
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#A6002E" />
    </linearGradient>
  </defs>

  <!-- Film Strip Container -->
  <rect x="150" y="145" width="212" height="222" rx="35" ry="35" fill="#FFE5E5" />

  <!-- Inner Film Frames -->
  <rect x="210" y="175" width="96" height="75" rx="8" ry="8" fill="#C3002F" />
  <rect x="210" y="265" width="96" height="75" rx="8" ry="8" fill="#C3002F" />

  <!-- Left Sprocket Holes -->
  <rect x="175" y="172" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="175" y="210" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="175" y="248" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="175" y="286" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="175" y="324" width="20" height="20" rx="4" ry="4" fill="#C3002F" />

  <!-- Right Sprocket Holes -->
  <rect x="318" y="172" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="318" y="210" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="318" y="248" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="318" y="286" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
  <rect x="318" y="324" width="20" height="20" rx="4" ry="4" fill="#C3002F" />
</svg>
